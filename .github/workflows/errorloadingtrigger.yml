name: Website Test

on:
  schedule:
    - cron: '*/10 * * * *'  
  workflow_dispatch:
    # 允许手动运行

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python auto_post.py  # 确保文件名正确
