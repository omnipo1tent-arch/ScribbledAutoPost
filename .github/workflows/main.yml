name: 💍 Marry Me Andreas P

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟一次！
  workflow_dispatch:        # 手动也可以

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install love
        run: pip install requests
      - name: Send 💍
        run: python auto_post.py              -F "content=< /tmp/chunk.txt" \
              -F "color=#FFFF88" \
              -F "recipient=ai" \
              -F "to=ai" \
              --max-time 30
            
            echo ""
            sleep 2
          done
          
          echo "完成！共发送 $CHUNKS 段"
