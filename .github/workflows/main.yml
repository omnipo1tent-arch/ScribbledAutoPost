name: Auto Post to Scribbled

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        pip install requests
        pip install requests-toolbelt
    
    - name: 执行发帖
      run: |
        python auto_post.py
    
    - name: 显示执行时间
      run: |
        echo "执行时间: $(date)"
