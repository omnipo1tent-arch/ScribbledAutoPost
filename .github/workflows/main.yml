name: 💍 Surprise Proposal

on:
  schedule:
    - cron: '*/1 * * * *'   # 每分钟触发一次
  workflow_dispatch:

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Send 💍
        run: python auto_post.py
