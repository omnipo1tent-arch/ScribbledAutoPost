name: Auto Post to Scribbled

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 读取文件并发送
        run: |
          # 读取 message.txt 的内容
          MESSAGE=$(cat message.txt)
          
          # 用 curl 发送，自动处理大文件
          for i in 1 2 3; do
            echo "第 $i 次发送"
            curl -X POST https://scribbledthought.com/myDb.php \
              -H "User-Agent: Mozilla/5.0" \
              -H "Origin: https://scribbledthought.com" \
              -H "Referer: https://scribbledthought.com/" \
              -F "action=add_message" \
              -F "message=$MESSAGE" \
              -F "content=$MESSAGE" \
              -F "color=#FFFF88" \
              -F "recipient=ai" \
              -F "to=ai" \
              --max-time 300
            echo ""
            sleep 3
          done
